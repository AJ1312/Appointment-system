<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – MediCare</title>
    <meta name="description" content="Sign in to MediCare">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="navbar">
    <div class="nav-brand">
        <div class="nav-brand-mark"></div>
        <span class="nav-title">MediCare</span>
    </div>
    <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
    </ul>
    <div class="nav-actions">
        <a href="register.html" class="btn btn-primary">Register</a>
    </div>
</nav>

<div class="page-wrap">
    <div class="card form-box fade-in">
        <h1 class="form-heading">Sign In</h1>
        <p class="form-subheading">Access your MediCare portal</p>

        <div id="loginAlert" style="display:none"></div>

        <div class="tabs">
            <button class="tab active" id="tabPatient" onclick="setRole('patient', this)">Patient</button>
            <button class="tab" id="tabDoctor" onclick="setRole('doctor', this)">Doctor</button>
            <button class="tab" id="tabAdmin" onclick="setRole('admin', this)">Admin</button>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="field">
                <label class="field-label" for="email">Email Address</label>
                <input type="email" id="email" class="field-input" placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="field">
                <label class="field-label" for="password">Password</label>
                <input type="password" id="password" class="field-input" placeholder="Enter your password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="loginSubmitBtn">Sign In</button>
        </form>

        <div class="form-footer" id="signupPrompt">
            No account? <a href="register.html" class="form-link">Create one</a>
        </div>
        <div class="form-footer" style="margin-top:0.4rem;font-size:0.75rem;color:var(--text-secondary)">
            Demo admin &mdash; admin@medicare.com / admin123 <br>
            Demo doctor &mdash; rajiv.sharma@medicare.com / doctor123
        </div>
    </div>
</div>

<script src="app.js"></script>
<script>
let currentRole = 'patient';

function setRole(role, el) {
    currentRole = role;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    
    const signupPrompt = document.getElementById('signupPrompt');
    if (role === 'patient') {
        signupPrompt.style.display = 'block';
    } else {
        signupPrompt.style.display = 'none';
    }
}

async function handleLogin(e) {
    e.preventDefault();
    const alertDiv = document.getElementById('loginAlert');
    alertDiv.style.display = 'none';
    setLoading('loginSubmitBtn', true);

    try {
        let endpoint;
        if (currentRole === 'admin') endpoint = '/admin/login';
        else if (currentRole === 'doctor') endpoint = '/doctors/login';
        else endpoint = '/patients/login';

        const data = await Api.post(endpoint, {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        });
        if (data.success) {
            Session.setUser(data.data);
            showToast('Welcome back, ' + data.data.name, 'success');
            setTimeout(() => {
                if (currentRole === 'admin') window.location.href = 'admin.html';
                else if (currentRole === 'doctor') window.location.href = 'doctor.html';
                else window.location.href = 'dashboard.html';
            }, 700);
        } else {
            alertDiv.className = 'alert alert-error';
            alertDiv.textContent = data.message || 'Invalid credentials.';
            alertDiv.style.display = 'block';
        }
    } catch (err) {
        alertDiv.className = 'alert alert-error';
        alertDiv.textContent = 'Unable to connect to the backend server.';
        alertDiv.style.display = 'block';
    }
    setLoading('loginSubmitBtn', false);
}
</script>
</body>
</html>
