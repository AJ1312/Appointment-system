<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors – MediCare</title>
    <meta name="description" content="Browse specialists and book an appointment on MediCare">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="navbar">
    <div class="nav-brand">
        <div class="nav-brand-mark"></div>
        <span class="nav-title">MediCare</span>
    </div>
    <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="doctors.html" class="nav-link active">Doctors</a></li>
        <li><a href="queue.html" class="nav-link">Queue Status</a></li>
    </ul>
    <div class="nav-actions">
        <a href="login.html" class="btn btn-ghost" id="loginBtn">Sign In</a>
        <a href="dashboard.html" class="btn btn-primary" id="dashLink" style="display:none">Dashboard</a>
    </div>
</nav>

<div style="padding: 6.5rem 3rem 4rem; max-width: 1200px; margin: 0 auto;">
    <div style="margin-bottom:2.5rem">
        <span class="label">Medical Staff</span>
        <h1 style="font-size:1.8rem;font-weight:700;letter-spacing:-0.02em;margin-bottom:1.25rem">Our Specialists</h1>
        <div style="display:flex;gap:0.75rem;flex-wrap:wrap">
            <input type="text" id="searchInput" class="field-input" style="max-width:260px" placeholder="Search by name or specialization..." oninput="filterDoctors()">
            <select id="specFilter" class="field-select" style="max-width:220px" onchange="filterDoctors()">
                <option value="">All Specializations</option>
            </select>
        </div>
    </div>

    <div id="doctorsGrid" class="doctors-grid">
        <div style="text-align:center;padding:3rem;color:var(--text-secondary);grid-column:1/-1">Loading doctors...</div>
    </div>
</div>

<footer class="footer">
    <div class="footer-brand">MediCare</div>
    <p>AI-Assisted Medical Appointment System &mdash; Hindalco 2026</p>
</footer>

<script src="app.js"></script>
<script>
let allDoctors = [];

async function init() {
    const user = Session.getUser();
    if (user) {
        document.getElementById('dashLink').style.display = 'inline-flex';
    }
    await loadSpecsFilter();
    await loadAllDoctors();
}

async function loadSpecsFilter() {
    try {
        const specs = await Api.get('/specializations');
        const sel   = document.getElementById('specFilter');
        (specs || []).forEach(s => sel.innerHTML += `<option value="${s.specializationId}">${s.name}</option>`);
    } catch {}
}

async function loadAllDoctors() {
    try {
        const data  = await Api.get('/doctors');
        allDoctors  = data.data || [];
        renderDoctors(allDoctors);
    } catch {
        document.getElementById('doctorsGrid').innerHTML =
            '<div style="text-align:center;padding:3rem;color:var(--danger);grid-column:1/-1">Backend not connected. Start the Spring Boot server first.</div>';
    }
}

function filterDoctors() {
    const specId = document.getElementById('specFilter').value;
    const search = document.getElementById('searchInput').value.toLowerCase();
    let list     = allDoctors;
    if (specId) list = list.filter(d => d.specializationId == specId);
    if (search) list = list.filter(d =>
        d.name.toLowerCase().includes(search) ||
        (d.specializationName || '').toLowerCase().includes(search)
    );
    renderDoctors(list);
}

function renderDoctors(doctors) {
    const grid = document.getElementById('doctorsGrid');
    if (!doctors.length) {
        grid.innerHTML = '<div style="text-align:center;padding:3rem;color:var(--text-secondary);grid-column:1/-1">No doctors found matching your search.</div>';
        return;
    }
    grid.innerHTML = doctors.map(d => {
        const ini = d.name.split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();
        
        const slotHtml = d.availableSlots && d.availableSlots.length > 0
            ? `<div style="margin-top:0.75rem">
                <span class="label">Earliest slots:</span>
                <div class="slots-container">
                    ${d.availableSlots.slice(0,3).map(slot => `
                        <div class="slot-badge" style="font-size:0.72rem;padding:0.25rem 0.5rem" onclick="bookSlot(${d.doctorId}, '${slot.date}')">
                            ${slot.date.slice(5)}: ${slot.time.split(' ')[0]}
                        </div>
                    `).join('')}
                </div>
               </div>`
            : `<div style="font-size:0.75rem;color:var(--text-secondary);margin-top:0.5rem">No custom slots scheduled.</div>`;
            
        return `
        <div class="card doctor-card fade-in">
            <div class="doctor-avatar"><span class="doctor-initials">${ini}</span></div>
            <div class="doctor-name">${d.name}</div>
            <div class="doctor-spec">${d.specializationName || 'General'}</div>
            <div class="doctor-meta">${d.qualification || 'MBBS'}</div>
            <div class="doctor-meta">${d.experienceYears ?? '—'} yrs experience</div>
            <div class="doctor-meta">${d.consultationDuration || 15} min consults</div>
            ${slotHtml}
            <button class="btn btn-outline btn-sm btn-full" style="margin-top:0.75rem" onclick="bookSlot(${d.doctorId})">Book Consultation</button>
        </div>`;
    }).join('');
}

function bookSlot(doctorId, date = null) {
    const user = Session.getUser();
    if (!user) {
        showToast('Please sign in to book an appointment', 'info');
        setTimeout(() => { window.location.href = 'login.html'; }, 1000);
        return;
    }
    
    // Redirect to patient dashboard booking section
    Session.set('booking_doctor_redirect', { doctorId, date });
    window.location.href = 'dashboard.html';
}

init();
updateNav();
</script>
</body>
</html>
