<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – MediCare</title>
    <meta name="description" content="Create a patient account on MediCare">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="navbar">
    <div class="nav-brand">
        <div class="nav-brand-mark"></div>
        <span class="nav-title">MediCare</span>
    </div>
    <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
    </ul>
    <div class="nav-actions">
        <a href="login.html" class="btn btn-ghost">Sign In</a>
    </div>
</nav>

<div class="page-wrap">
    <div class="card form-box form-box-wide fade-in">
        <h1 class="form-heading">Create Account</h1>
        <p class="form-subheading">Register as a new patient &mdash; it only takes a moment</p>

        <div id="regAlert" style="display:none"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="field-row">
                <div class="field">
                    <label class="field-label" for="name">Full Name</label>
                    <input type="text" id="name" class="field-input" placeholder="Ajitesh Sharma" required>
                </div>
                <div class="field">
                    <label class="field-label" for="email">Email Address</label>
                    <input type="email" id="email" class="field-input" placeholder="you@example.com" required autocomplete="email">
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label class="field-label" for="phone">Phone Number</label>
                    <input type="tel" id="phone" class="field-input" placeholder="9876543210">
                </div>
                <div class="field">
                    <label class="field-label" for="gender">Gender</label>
                    <select id="gender" class="field-select">
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label class="field-label" for="dob">Date of Birth</label>
                    <input type="date" id="dob" class="field-input">
                </div>
                <div class="field">
                    <label class="field-label" for="password">Password</label>
                    <input type="password" id="password" class="field-input" placeholder="Minimum 6 characters" required minlength="6" autocomplete="new-password">
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="regBtn">Create Account</button>
        </form>

        <div class="form-footer">
            Already have an account? <a href="login.html" class="form-link">Sign in</a>
        </div>
    </div>
</div>

<script src="app.js"></script>
<script>
async function handleRegister(e) {
    e.preventDefault();
    const alertDiv = document.getElementById('regAlert');
    alertDiv.style.display = 'none';
    setLoading('regBtn', true);

    try {
        const data = await Api.post('/patients/register', {
            name:        document.getElementById('name').value,
            email:       document.getElementById('email').value,
            phone:       document.getElementById('phone').value,
            password:    document.getElementById('password').value,
            gender:      document.getElementById('gender').value,
            dateOfBirth: document.getElementById('dob').value || null
        });
        if (data.success) {
            alertDiv.className = 'alert alert-success';
            alertDiv.textContent = 'Account created successfully. Redirecting to sign in...';
            alertDiv.style.display = 'block';
            setTimeout(() => window.location.href = 'login.html', 1400);
        } else {
            alertDiv.className = 'alert alert-error';
            alertDiv.textContent = data.message;
            alertDiv.style.display = 'block';
        }
    } catch {
        alertDiv.className = 'alert alert-error';
        alertDiv.textContent = 'Connection error. Is the backend server running?';
        alertDiv.style.display = 'block';
    }
    setLoading('regBtn', false);
}
</script>
</body>
</html>
